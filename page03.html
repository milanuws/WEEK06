<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
<script>
  fetch("students.json")
    .then(response => {
      if (!response.ok) {
        throw new Error("Network response was not ok");
      }
      return response.text(); // get raw text like your original XHR
    })
    .then(content => {
      console.log(content);

      let students = JSON.parse(content);
      console.log(students);

      for (let i = 1; i <= students.length; i++) {
        document.write(
          students[i - 1].firstname + " " +
          students[i - 1].lastname + " " +
          students[i - 1].bannerId + "<br>"
        );
      }
    })
    .catch(error => {
      console.error("Fetch error:", error);
    });
</script>
  </body>
</html>
